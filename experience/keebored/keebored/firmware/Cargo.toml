[package]
name = "firmware"
version = "0.1.0"
edition = "2024"

[dependencies]
#rp2040-hal = "0.12.0"
rp2040-hal = {version = "0.12.0", features = ["binary-info", "critical-section-impl", "rt", "defmt"]} #features required to make rust-lld work, wasted a lot of time on that :/
cortex-m = "0.7.9"
ssd1306 = "0.10.0"
panic-semihosting = "0.7.0"
panic-halt = "1.0.0"
ssd1309 = "0.4.0"
rp2040-boot2 = "0.3.0"
cortex-m-rt = "0.7.7"
embedded-hal = "1.0.0"
critical-section = {version = "1.2.0"}
portable-atomic = {version = "1.7.0", features = ["critical-section"]}
static_cell =  "2.1.1"
cortex-m-rtic = "1.1.4"
#proc-macro-error2 = "2.0.0"

#[target.'cfg( target_arch = "arm" )'.dependencies]
#embassy-executor = {version = "0.5", features = ["arch-cortex-m", "executor-thread"]}
